# .github/workflows/django-ci.yml

name: Django CI Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Disable Module Initialization for Tests
      run: |
        # Comment out the module initialization call at the end of api.py
        sed -i 's/^initialize_modules()$/# initialize_modules() # Disabled for CI/' app/api.py
        
        # Also comment out any database queries at module level
        # This prevents "auth_user does not exist" error during test setup
        echo "Module initialization disabled for testing"

    - name: Run Django Migrations and Tests
      env:
        SECRET_KEY: "dummy-secret-key-for-testing"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: localhost
        DB_PORT: 5432
        DJANGO_SETTINGS_MODULE: "lenskart_backend.settings"  
      run: |
        # First run migrations to create all tables
        python manage.py migrate --noinput
        
        # Then run the tests
        python manage.py test --noinput