# .github/workflows/django-ci.yml

name: Django CI Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- THIS IS THE FINAL, CORRECTED STEP ---
    - name: Disable FreeCAD Initialization for Test
      # This command is now much more specific.
      # ^ matches the beginning of the line.
      # $ matches the end of the line.
      # This ensures it ONLY matches the line that is exactly "initialize_freecad()".
      run: |
        sed -i 's/^initialize_freecad()$/# initialize_freecad()/' app/api.py

    - name: Wait for PostgreSQL
      run: |
        for i in $(seq 1 10); do
          pg_isready -h postgres -p 5432 -U test_user && break
          echo "Waiting for PostgreSQL... ($i/10)"
          sleep 1
        done
    - name: Run Django Migrations and Tests
      env:
        SECRET_KEY: "dummy"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: postgres
        DB_PORT: 5432
      run: |
        python manage.py test