# .github/workflows/django-ci.yml

name: Django CI Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test: # Renamed job for clarity
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django App Tests
      # This step now ONLY runs the tests for your 'app'.
      # This avoids running any code that would try to initialize FreeCAD.
      env:
        # We still need dummy variables for settings.py to load correctly.
        SECRET_KEY: "dummy-secret-key-for-testing"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: "localhost"
        DB_PORT: "5432"
      run: |
        python manage.py test app