# .github/workflows/django-ci.yml

name: Django CI Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Disable FreeCAD Initialization for Test
      run: |
        sed -i 's/initialize_freecad()/ # initialize_freecad()/' app/api.py

    - name: Run Django Migrations and Tests
      env:
        SECRET_KEY: "dummy"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        # First, run migrations. This will now succeed because the app starts correctly.
        python manage.py migrate
        
        # Then, run the tests.
        python manage.py test app --keepdb