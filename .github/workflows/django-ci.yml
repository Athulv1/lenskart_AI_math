# .github/workflows/django-ci.yml

name: Django CI Tests (Diagnostic)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql-client

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Show Migration Status BEFORE migrate
      env:
        # Set all environment variables needed for settings.py
        SECRET_KEY: "dummy"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        echo "--- Running python manage.py showmigrations ---"
        python manage.py showmigrations
        
    - name: 2. Run Migrations with High Verbosity
      env:
        SECRET_KEY: "dummy"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        echo "--- Running python manage.py migrate ---"
        python manage.py migrate -v 3

    - name: 3. Verify Database Tables EXIST
      env:
        # PGPASSWORD is the standard way to provide a password to psql
        PGPASSWORD: test_password
      run: |
        echo "--- Checking for tables in test_db ---"
        psql -h 127.0.0.1 -U test_user -d test_db -c "\dt"

    - name: 4. Run Django App Tests
      env:
        SECRET_KEY: "dummy"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        echo "--- Running python manage.py test app --keepdb ---"
        python manage.py test app --keepdb